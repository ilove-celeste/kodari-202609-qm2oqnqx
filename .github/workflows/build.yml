name: Build AkumaVote

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.0"

      - name: Download WebView2 SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "1.0.4191.47"
          New-Item -ItemType Directory -Force -Path "webview2-sdk" | Out-Null
          Invoke-WebRequest "https://www.nuget.org/api/v2/package/Microsoft.Web.WebView2/$version" -OutFile "webview2-sdk.zip"
          Expand-Archive -Path "webview2-sdk.zip" -DestinationPath "webview2-sdk" -Force

      - name: Build WebView2 native bridge
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $vcvars = Get-ChildItem "C:\Program Files\Microsoft Visual Studio" -Filter "vcvars64.bat" -Recurse -ErrorAction SilentlyContinue |
                    Select-Object -First 1 -ExpandProperty FullName
          if (-not $vcvars) {
            throw "Visual C++ vcvars64.bat was not found."
          }

          $outDir = "src\client\resources\assets\akumavote\native"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          $jniInclude = "$env:JAVA_HOME\include"
          $jniWinInclude = "$env:JAVA_HOME\include\win32"
          $sdkInclude = (Resolve-Path "webview2-sdk\build\native\include").Path
          $sdkLib = (Resolve-Path "webview2-sdk\build\native\x64\WebView2LoaderStatic.lib").Path

          $outPath = (Resolve-Path $outDir).Path + "\\akumavote-webview2.dll"
          $cmdLine = 'call "' + $vcvars + '" && cl.exe /nologo /LD /MT /EHsc /std:c++17 /I"' + $jniInclude + '" /I"' + $jniWinInclude + '" /I"' + $sdkInclude + '" native\\akuma_webview2.cpp /link /OUT:"' + $outPath + '" "' + $sdkLib + '" user32.lib ole32.lib shlwapi.lib version.lib'
          Write-Host $cmdLine
          cmd.exe /d /c $cmdLine 2>&1 | Tee-Object -FilePath "native-build.log"
          if ($LASTEXITCODE -ne 0) {
            throw "Native WebView2 bridge compilation failed."
          }

      - name: Build
        run: gradle build --stacktrace

      - name: Upload native build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webview2-native-build-log
          path: native-build.log
          if-no-files-found: ignore

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: akumavote-jars
          path: build/libs/*.jar
          if-no-files-found: error
