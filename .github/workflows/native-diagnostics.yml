name: WebView2 Native Diagnostics

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  diagnose:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Download WebView2 SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "1.0.4191.47"
          Invoke-WebRequest "https://www.nuget.org/api/v2/package/Microsoft.Web.WebView2/$version" -OutFile "webview2-sdk.zip"
          Expand-Archive -Path "webview2-sdk.zip" -DestinationPath "webview2-sdk" -Force

      - name: Diagnose native compilation
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Continue"
          $log = "native-diagnostics.log"
          "=== Environment ===" | Out-File $log -Encoding utf8
          "JAVA_HOME=$env:JAVA_HOME" | Add-Content $log
          "PROCESSOR_ARCHITECTURE=$env:PROCESSOR_ARCHITECTURE" | Add-Content $log
          "=== vswhere ===" | Add-Content $log
          $vswhere = "$env:ProgramFiles(x86)\Microsoft Visual Studio\Installer\vswhere.exe"
          & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath 2>&1 | Add-Content $log

          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $vcvars = "$vs\VC\Auxiliary\Build\vcvars64.bat"
          $jniInclude = "$env:JAVA_HOME\include"
          $jniWinInclude = "$env:JAVA_HOME\include\win32"
          $sdkInclude = (Resolve-Path "webview2-sdk\build\native\include").Path
          $sdkLib = (Resolve-Path "webview2-sdk\build\native\x64\WebView2LoaderStatic.lib").Path
          New-Item -ItemType Directory -Force -Path "out" | Out-Null
          $outPath = (Resolve-Path "out").Path + "\akumavote-webview2.dll"

          "=== Paths ===" | Add-Content $log
          "vcvars=$vcvars" | Add-Content $log
          "jniInclude=$jniInclude" | Add-Content $log
          "jniWinInclude=$jniWinInclude" | Add-Content $log
          "sdkInclude=$sdkInclude" | Add-Content $log
          "sdkLib=$sdkLib" | Add-Content $log
          "outPath=$outPath" | Add-Content $log

          $script = @(
            'call "' + $vcvars + '"',
            'if errorlevel 1 exit /b 1',
            'where cl.exe',
            'cl.exe',
            'cl.exe /nologo /LD /MT /EHsc /std:c++17 /I"' + $jniInclude + '" /I"' + $jniWinInclude + '" /I"' + $sdkInclude + '" native\akuma_webview2.cpp /link /OUT:"' + $outPath + '" "' + $sdkLib + '" user32.lib ole32.lib shlwapi.lib version.lib',
            'echo CL_EXIT=%ERRORLEVEL%',
            'exit /b %ERRORLEVEL%'
          )
          Set-Content -Path "native-diagnostics.cmd" -Value ($script -join "`r`n") -Encoding ascii
          cmd.exe /c native-diagnostics.cmd > native-compiler.log 2>&1
          "=== Compiler output ===" | Add-Content $log
          Get-Content native-compiler.log | Add-Content $log
          "=== Generated files ===" | Add-Content $log
          Get-ChildItem -Recurse "out" | Select-Object FullName,Length | Out-String | Add-Content $log

      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: webview2-native-diagnostics
          path: |
            native-diagnostics.log
            native-compiler.log
            native-diagnostics.cmd
          if-no-files-found: warn
